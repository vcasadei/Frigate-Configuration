version: "3.9"

services:
  frigate:
    container_name: frigate_new
    image: ghcr.io/blakeblackshear/frigate:0.15.1
    privileged: true
    cap_add:
      - CAP_PERFMON
    restart: unless-stopped
    shm_size: "2g" # adjust based on the number of cameras and resolution
    volumes:
      - /dev/apex_0:/dev/apex_0
      - /etc/localtime:/etc/localtime:ro
      - /frigate/DATA/AppData/frigate/config:/config
      - /frigate/DATA/AppData/frigate/media:/media
    ports:
      - "80:5000" # Web UI
      - "8554:8554" # RTSP feeds
      - "8555:8555/tcp" # WebRTC over tcp
      - "8555:8555/udp" # WebRTC over udp
    environment:
      - FRIGATE_RTSP_PASSWORD="1793152311"
      - LIBVA_DRIVER_NAME=i965
