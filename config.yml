mqtt:
  enabled: false

objects:
  track:
    - person
    - car
    - motorcycle
    - bicycle
    - horse

detectors:
  coral:
    type: edgetpu
    device: pci

lpr:
  enabled: true
  format: ^[A-Z]{3}[0-9]([0-9][A-Z]|[A-Z][0-9])[0-9]$
  known_plates:
    # Real plates are configured directly on the live deployment and are not tracked in git.
    Vehicle1:
      - AAA0000
    Vehicle2:
      - BBB0000

cameras:
  PortaArea:
    enabled: true
    ffmpeg:
      input_args: preset-rtsp-udp
      hwaccel_args: preset-vaapi
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_CAMERA_RTSP_PASSWORD}@192.168.1.52:554/onvif1
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
      continuous:
        days: 0
      detections:
        retain:
          days: 20
          mode: all
      alerts:
        retain:
          days: 20
          mode: all
    zones:
      PortaCasa:
        coordinates: 0,1,1,1,1,0,0.399,0,0.396,0.073,0,0.088
        objects: person
    motion:
      mask:
        motion_mask_1:
          friendly_name: Motion Mask 1
          enabled: true
          coordinates: 0.396,0,0.398,0.064,0,0.07,0,0
    review:
      alerts:
        required_zones: PortaCasa

